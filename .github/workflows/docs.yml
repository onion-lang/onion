name: Deploy MkDocs to GitHub Pages

on:
  # The site documents the latest release, so it deploys from a release tag only:
  # release.yml dispatches this workflow with the new tag as its ref, and a release
  # published by hand fires `release`. A merge to `main` never changes the live site.
  release:
    types: [published]
  # Build (but do not deploy) on pull requests, so a broken site or an unlexable code
  # fence is caught before it is merged rather than after.
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
      # The Pygments lexer decides how every ```onion fence renders.
      - 'tools/pygments-onion/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          pip install mkdocs-material
          pip install mkdocs-glightbox
          # Registers the `onion` Pygments lexer through an entry point, which is what
          # makes the ~1200 ```onion fences highlight. Without it they render as plain
          # text and mkdocs does not complain, so verify the alias resolved.
          pip install ./tools/pygments-onion
          python -c "from pygments.lexers import get_lexer_by_name; get_lexer_by_name('onion')"

      - name: Check every ```onion fence lexes
        # mkdocs does not complain about an unhighlightable fence -- it just renders it as
        # plain text -- so this has to be an explicit gate.
        run: python tools/pygments-onion/check_docs.py docs README.md

      - name: Build documentation
        run: mkdocs build --strict

      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        run: mkdocs gh-deploy --force
