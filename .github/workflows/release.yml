name: release

# A release can be started two ways:
#
#   * pushing a `v*` tag (the original path), or
#   * running this workflow manually / via the API with a `version` input.
#
# The second path exists because pushing a `v*` tag from a client is rejected
# with HTTP 403 by the repository's tag protection, which left releases
# permanently stuck (issue #334). Here the tag is created by the workflow
# itself, using the Actions token that already holds `contents: write`, so no
# client-side tag push is involved.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to create, including the leading v (e.g. v0.5.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.version }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "Release tag must start with 'v' followed by a digit: $TAG" >&2; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release tag: $TAG"
      - name: Install sbt
        uses: sbt/setup-sbt@v1
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # sbt-dynver derives the version from the tag history, so the full
          # history (and existing tags) must be present.
          fetch-depth: 0
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'sbt'
      - name: Create the tag for a manual run
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists locally; nothing to create."
          else
            # Create the tag through the API rather than `git push`, so this
            # path does not depend on the client being allowed to push refs.
            gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f "ref=refs/tags/$TAG" \
              -f "sha=${GITHUB_SHA}"
            git fetch --tags --force
          fi
          # sbt-dynver reads the checked-out commit's tags, so point HEAD at
          # the tag we just created before resolving the version.
          git checkout -q "$TAG"
      - name: Resolve version
        id: version
        run: |
          # sbt can emit ANSI control sequences even with -error, so disable
          # formatting and strip any residual escapes, then take the last line
          # that looks like a version number.
          RAW="$(sbt -Dsbt.log.noformat=true -Dsbt.color=false -error 'print version' 2>/dev/null)"
          VERSION="$(printf '%s\n' "$RAW" | sed -E 's/\x1b\[[0-9;?]*[A-Za-z]//g' | grep -E '^[0-9]+\.[0-9]+' | tail -1)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "resolved version: $VERSION"
      - name: Verify tag matches version
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          # Strip leading 'v' from tag for comparison
          TAG_VERSION="${TAG#v}"
          if [ "$TAG_VERSION" != "$VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match build version ($VERSION)" >&2
            exit 1
          fi
      - name: Test
        env:
          SBT_OPTS: "-Xmx10G -XX:+UseG1GC -Xss16m"
        run: sbt test
      - name: Build artifacts
        env:
          SBT_OPTS: "-Xmx10G -XX:+UseG1GC -Xss16m"
        run: sbt "assembly; dist"
      - name: Collect artifacts
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p release-artifacts
          OUT_DIR="target/out/jvm/scala-3.3.7/onion"
          FAT_JAR="$OUT_DIR/onion-${VERSION}.jar"
          test -f "$FAT_JAR"
          cp "$FAT_JAR" "release-artifacts/onion-${VERSION}.jar"
          cp "$OUT_DIR/onion-dist-${VERSION}.zip" "release-artifacts/onion-dist-${VERSION}.zip"
      - name: Generate checksums
        run: |
          cd release-artifacts
          sha256sum * > checksums.txt
      - name: Smoke test the fat jar
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo 'IO::println("release smoke test ok")' > /tmp/smoke.on
          java -cp "release-artifacts/onion-${VERSION}.jar" onion.tools.ScriptRunner /tmp/smoke.on | grep -q "release smoke test ok"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          PRERELEASE=""
          case "$TAG" in
            *-M*|*-RC*|*-rc*|*-alpha*|*-beta*) PRERELEASE="--prerelease" ;;
          esac
          gh release create "$TAG" $PRERELEASE \
            --title "Onion ${TAG}" \
            --generate-notes \
            release-artifacts/onion-${VERSION}.jar \
            release-artifacts/onion-dist-${VERSION}.zip \
            release-artifacts/checksums.txt

  # Maven Central: org.onion-lang:onion and org.onion-lang:onion-llm, signed, uploaded to
  # the Central Portal as one deployment. A separate job, after the GitHub Release, so a
  # Central problem can never block or undo the release the project already ships.
  #
  # Until the maintainer has added the four secrets (RELEASING.md, "Publishing to Maven
  # Central") this job only leaves a notice and succeeds. By default the deployment is
  # uploaded and validated but NOT released: it waits in the Portal UI for a manual
  # "Publish", because a release on Central is permanent. Set the repository variable
  # CENTRAL_AUTO_RELEASE to `true` to release automatically once that has been proven.
  publish-central:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
      CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
      PGP_SECRET: ${{ secrets.PGP_SECRET }}
      PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
    steps:
      - name: Check publishing secrets
        id: secrets
        run: |
          missing=""
          present=""
          for name in CENTRAL_USERNAME CENTRAL_PASSWORD PGP_SECRET PGP_PASSPHRASE; do
            if [ -z "${!name}" ]; then missing="$missing $name"; else present="$present $name"; fi
          done
          if [ -z "$present" ]; then
            echo "::notice title=Maven Central publishing skipped::No publishing secrets are set, so nothing was uploaded to Maven Central. The GitHub Release is unaffected. See RELEASING.md, 'Publishing to Maven Central'."
            echo "available=false" >> "$GITHUB_OUTPUT"
          elif [ -n "$missing" ]; then
            echo "::error title=Maven Central publishing misconfigured::Set all four secrets or none. Missing:$missing" >&2
            exit 1
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install sbt
        if: steps.secrets.outputs.available == 'true'
        uses: sbt/setup-sbt@v1
        with:
          # No build caches in this job (here or in setup-java below): what goes to
          # Central, permanently, is built from the tag's sources from scratch.
          disk-cache: false
      - name: Checkout the release tag
        if: steps.secrets.outputs.available == 'true'
        uses: actions/checkout@v4
        with:
          # The release job created the tag already (for a manual run, through the API).
          ref: refs/tags/${{ needs.release.outputs.tag }}
          fetch-depth: 0
      - name: Setup JDK
        if: steps.secrets.outputs.available == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Import the signing key
        if: steps.secrets.outputs.available == 'true'
        run: |
          # PGP_SECRET is the base64 of the ASCII-armored secret key; armored text pasted
          # as-is is accepted too.
          if printf '%s' "$PGP_SECRET" | head -c 40 | grep -q -- '-----BEGIN PGP'; then
            printf '%s\n' "$PGP_SECRET" | gpg --batch --import
          else
            printf '%s' "$PGP_SECRET" | base64 --decode | gpg --batch --import
          fi
          gpg --list-secret-keys --keyid-format long
      - name: Stage, sign and upload
        if: steps.secrets.outputs.available == 'true'
        env:
          SBT_OPTS: "-Xmx6G -XX:+UseG1GC -Xss16m"
          AUTO_RELEASE: ${{ vars.CENTRAL_AUTO_RELEASE }}
        run: |
          # centralStage refuses any version that is not a clean release version, then
          # runs publishSigned for both artifacts into target/sona-staging.
          if [ "$AUTO_RELEASE" = "true" ]; then UPLOAD=sonaRelease; else UPLOAD=sonaUpload; fi
          echo "version: ${{ needs.release.outputs.version }}, upload command: $UPLOAD"
          # One ;-separated command: the sbt 2 client joins separate arguments with spaces,
          # which glued the alias tail and the upload into one invalid command.
          sbt -v "centralStage; $UPLOAD"
          if [ "$UPLOAD" = "sonaUpload" ]; then
            echo "::notice title=Maven Central deployment awaiting release::${{ needs.release.outputs.tag }} is uploaded and validated. Release it at https://central.sonatype.com/publishing/deployments (Publish), or Drop it."
          fi
      - name: Keep the staged bundle
        if: always() && steps.secrets.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: maven-central-${{ needs.release.outputs.tag }}
          path: target/sona-staging
          if-no-files-found: ignore
