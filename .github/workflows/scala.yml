name: onion

# Pushes to main only: a pushed PR branch is already covered by `pull_request`, and
# running both would build everything twice (#2004).
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - name: Install sbt
      uses: sbt/setup-sbt@v1
      with:
        disk-cache: false
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: 'sbt'
    - name: Build and Test
      env:
        SBT_OPTS: "-Xmx10G -XX:+UseG1GC -Xss16m"
      run: sbt -v +test
    # Batteries are separate subprojects the root does not aggregate, so `+test` above
    # does not reach them. Their tests use a local fake of each service: no secrets.
    - name: Test batteries
      env:
        SBT_OPTS: "-Xmx4G -XX:+UseG1GC -Xss16m"
      run: sbt -v llm/test
    # A release tag also publishes both modules to Maven Central (release.yml,
    # publish-central). Build what that job uploads -- jars, sources, javadoc, POMs -- on
    # every push, so a broken javadoc or POM shows up here and not on release day.
    - name: Build Maven Central artifacts
      env:
        SBT_OPTS: "-Xmx4G -XX:+UseG1GC -Xss16m"
      run: sbt -v "onion/packageDoc; onion/packageSrc; onion/makePom; llm/packageDoc; llm/packageSrc; llm/makePom"

  # The same suite in the Japanese locale. Error messages are bilingual, and a test that
  # asserts localized text passes in one locale and fails in the other (CLAUDE.md Testing).
  test-ja:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - name: Install sbt
      uses: sbt/setup-sbt@v1
      with:
        disk-cache: false
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: 'sbt'
    - name: Build and Test (ja)
      env:
        SBT_OPTS: "-Xmx10G -XX:+UseG1GC -Xss16m -Duser.language=ja -Duser.country=JP"
      run: sbt -v +test
