name: onion

on:
  pull_request:
  push:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - name: Install sbt
      uses: sbt/setup-sbt@v1
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: 'sbt'
    - name: Build and Test
      env:
        SBT_OPTS: "-Xmx10G -XX:+UseG1GC -Xss16m"
      run: sbt -v +test
