error.parsing.hint.old_extends=Hint: a superclass is named with `extends`, not `:` — write `class A extends B`.
error.parsing.hint.old_conforms=Hint: interfaces are named with `conforms`, not `<:` — write `class A conforms I` (and `class A extends B conforms I`).
error.parsing.hint.trailing_lambda_parens=Hint: a trailing lambda''s parameters aren''t parenthesized — write `'{' {0} -> ... '}'`, not `'{' ({0}) -> ... '}'`.
error.parsing.hint.old_trailing_arrow=Hint: the arrow in a trailing lambda is `->`, the same as everywhere else — write `{ x -> ... }`. (`=>` is no longer part of the language.)
error.parsing.hint.old_lambda_arrow=Hint: the arrow in a lambda is `->`, the same as everywhere else — write `(x) -> ...` (or `x -> ...` for a single bare parameter). (`=>` is no longer part of the language.)
error.parsing.hint.python_style_lambda=Hint: Onion has no `lambda` keyword — write an arrow lambda instead — write `({0}) -> {1}`, not `lambda {0}: {1}`.
error.parsing.hint.old_super_init=Hint: arguments for the superclass constructor are written on the `extends` clause — `class Sub(x: Int) extends Base(x)` — and a `def this` in such a class delegates to it with `: this(...)`. The form `def this(x) : (x)` no longer exists.
error.parsing.hint.python_style_return_arrow=Hint: a method''s return type follows a colon, not `->` — write `def {0}(...): {1} '{' ... '}'`, not `def {0}(...) -> {1} '{' ... '}'`.
error.parsing.hint.dangling_return_type_colon=Hint: after `:` a method needs its return type on the same line -- write `def {0}(...): Void '{' ... '}'`, or drop the `:` entirely if you meant no declared return type: `def {0}(...) '{' ... '}'`.
error.parsing.hint.ternary=Hint: Onion has no `cond ? a : b` ternary operator. `if`/`else` works as an expression, so write `if cond { a } else { b }`.
error.parsing.hint.nullish_coalescing=Hint: Onion has no `??` nullish-coalescing operator — use the Elvis operator instead — write `a ?: b`, not `a ?? b`.
error.parsing.hint.dangling_else=Hint: `else` must directly follow an `if` block's closing `}` -- check that a matching `if` immediately precedes it (only `if` takes an `else`).
error.parsing.hint.old_for_in=Hint: Onion does not support `for x in xs`. Use `foreach x: Type in xs { ... }` (or a C-style loop: `for var i = 0; i < xs.size(); i = i + 1 { ... }`).
error.parsing.hint.foreach_parens=Hint: `foreach` doesn''t parenthesize a single loop variable — write `foreach x: Type in xs { ... }`, not `foreach (x in xs) { ... }`. Parentheses are only for destructuring a map''s entries: `foreach (k, v) in map { ... }`.
error.parsing.hint.switch_not_supported=Hint: Onion has no `switch` statement. `select` covers the same ground, so write `select value { case 1: ...; else: ... }`.
error.parsing.hint.when_not_supported=Hint: Onion has no Kotlin-style `when` expression. `select` covers the same ground, so write `select value { case 1: ...; else: ... }`. (`when` is reserved in Onion only as the case-guard keyword, `case p when guard: ...`.)
error.parsing.hint.match_not_supported=Hint: Onion has no Rust/Scala/OCaml-style `match` expression. `select` covers the same ground, so write `select value { case 1: ...; else: ... }`.
error.parsing.hint.default_case_not_supported=Hint: Onion's `select` has no Java/JavaScript-style `default` case. Use `else` instead: `select value { case 1: ...; else: ... }`.
error.parsing.hint.elif_not_supported=Hint: Onion has no Python-style `elif` clause. Chain with `else if` instead: `if a { ... } else if b { ... } else { ... }`.
error.parsing.hint.elsif_not_supported=Hint: Onion has no Ruby-style `elsif` clause. Chain with `else if` instead: `if a { ... } else if b { ... } else { ... }`.
error.parsing.hint.elseif_not_supported=Hint: Onion has no PHP-style `elseif` clause. Chain with `else if` instead: `if a { ... } else if b { ... } else { ... }`.
error.parsing.hint.except_not_supported=Hint: Onion has no Python-style `except` clause. Catch exceptions with `catch` instead: `try { ... } catch e: Exception { ... }`.
error.parsing.hint.python_style_raise_construct=Hint: Onion has no Python-style `raise` statement — throw an exception with `throw new` instead — write `throw new {0}({1})`, not `raise {0}({1})`.
error.parsing.hint.python_style_raise=Hint: Onion has no Python-style `raise` statement — throw an exception with `throw` instead — write `throw {0}`, not `raise {0}`.
error.parsing.hint.unless_not_supported=Hint: Onion has no Ruby-style `unless` statement. Negate the condition and use `if` instead: `if !condition { ... }`.
error.parsing.hint.await_not_supported=Hint: Onion has no JavaScript/Python-style prefix `await` — a `Future` is awaited postfix instead — write `{0}.await()`, not `await {0}`.
error.parsing.hint.yield_not_supported=Hint: Onion has no JavaScript/Python-style `yield` for generators or coroutines. A function returns one value, so build and return a `List` of the results instead.
error.parsing.hint.with_as_statement=Hint: Onion has no Python-style `with ... as ...` resource-management block — write a try-with-resources block instead: `try (val {0} = {1}) '{' ... '}'`, not `with {1} as {0} '{' ... '}'`.
error.parsing.hint.until_not_supported=Hint: Onion has no Ruby-style `until` loop. Negate the condition and use `while` instead: `while !condition { ... }`.
error.parsing.hint.not_operator=Hint: Onion has no Python/Ruby-style `not` operator for boolean negation. Use `!` instead: `if !condition { ... }`, not `if not condition { ... }`.
error.parsing.hint.typeof_not_supported=Hint: Onion has no JavaScript/Python-style `typeof` operator — check a value''s type with the `is` operator instead — write `{0} is Type`, not `typeof {0}`.
error.parsing.hint.python_style_colon_block=Hint: Onion blocks use '{' ... '}', not a trailing `:` — write `{0} {1} '{' ... '}'`, not `{0} {1}:`.
error.parsing.hint.fun_declaration=Hint: functions and methods are declared with `def` — Onion has no `fun`/`func`/`fn`/`function` keyword. Write `def name(...): ReturnType { ... }`.
error.parsing.hint.fun_extension_declaration=Hint: Onion has no `fun Type.method(...)` receiver syntax for extension methods — write an extension block instead: `extension {0} '{' def {1}(...): ReturnType '{' ... '}' '}'`, not `fun {0}.{1}(...) '{' ... '}'`.
error.parsing.hint.block_expected=Hint: a block `{ ... }` is expected here.
error.parsing.hint.catch_parens=Hint: a `catch` clause's variable isn't parenthesized — write `catch e: Exception { ... }`, not `catch (e: Exception) { ... }`.
error.parsing.hint.c_style_for=Hint: a `for` loop's clauses aren't parenthesized — write `for var i: Int = 0; i < 10; i++ { ... }`, not `for (int i = 0; i < 10; i++) { ... }`.
error.parsing.hint.for_each_destructure=Hint: `for` doesn''t destructure or iterate a collection — that''s `foreach`''s job — write `foreach ({0}) in {1} '{' ... '}'`, not `for ({0}) in {1}`.
error.parsing.hint.java_style_enhanced_for=Hint: Onion''s enhanced-for is `foreach` — write `foreach {0}: {1} in {2} '{' ... '}'`, not `for ({1} {0} : {2}) '{' ... '}'`.
error.parsing.hint.java_style_import=Hint: imports are wrapped in braces — write `import { java.util.List }`, not `import java.util.List;`.
error.parsing.hint.java_style_import_alias=Hint: an import''s alias is named with `as`, not `=` — write `{0} as {1}`, not `{1} = {0}`.
error.parsing.hint.java_style_constructor=Hint: a constructor is declared with `def this`, not by naming a method after the class — write `def this(...) { ... }`, not `public ClassName(...) { ... }`.
error.parsing.hint.js_style_constructor=Hint: Onion has no JS/TS-style `constructor` method name — a constructor is declared with `def this` — write `def this(...) { ... }`, not `constructor(...) { ... }`.
error.parsing.hint.java_style_method=Hint: a method's return type comes after its name, not before it, and needs `def` — write `public:` on its own line, then `def method(): void { ... }`, not `public void method() { ... }`.
error.parsing.hint.missing_parameter_type=Hint: every parameter needs an explicit type after its name — write `{0}: Type`, not a bare `{0}`.
error.parsing.hint.java_style_field=Hint: a field or local variable is declared with `val`/`var` before the name, not with the type before it — write `var {1}: {0}` (or `val {1}: {0}` if it never changes), not `{0} {1}`.
error.parsing.hint.case_type_colon=Hint: a `select` type pattern uses `is`, not `:` — write `case s is String:`, not `case s: String:`.
error.parsing.hint.java_style_generics=Hint: generics use square brackets, not angle brackets — write `{0}[{1}]`, not `{0}<{1}>`.
error.parsing.hint.java_style_diamond_operator=Hint: Onion has no Java-style diamond operator `<>` — a constructor''s type arguments are inferred from its arguments (or the expected type), so just drop it: write `new {0}(...)`, not `new {0}<>(...)`.
error.parsing.hint.java_style_generic_constructor_call=Hint: generics use square brackets, not angle brackets, in a constructor call too — write `new {0}[{1}](...)`, not `new {0}<{1}>(...)`.
error.parsing.hint.primitive_dot_static=Hint: `{0}` names a type, not a value — static members are accessed with `::`, not `.` — write `{0}::{1}`, not `{0}.{1}`.
error.parsing.hint.java_style_record_body=Hint: a record''s components are declared in parentheses after its name, not in a brace body — write `record {0}(x: Int, y: Int)`, not `record {0} '{' x; y '}'`. A record may still take a `'{' ... '}'` body after the parentheses, for extra methods.
error.parsing.hint.java_style_try_resource=Hint: a try-with-resources declaration starts with `val` before the name, not with the type before it, and is always `val` (never `var`) — write `try (val {1}: {0} = ...)`, not `try ({0} {1} = ...)`.
error.parsing.hint.java_style_implements=Hint: interfaces are named with `conforms`, not Java''s `implements` — write `class {0} conforms {1}`, not `class {0} implements {1}`.
error.parsing.hint.java_style_annotated_method=Hint: an annotation like `@{0}` is written directly before `def` — the method still needs `def` and its return type after the name — write `@{0} def method(): void '{' ... '}'`, not `@{0} void method() '{' ... '}'`.
error.parsing.hint.reserved_word_identifier=Hint: `{0}` is a reserved word and can''t be used as an identifier directly — escape it with backticks, writing `{0}` (with backticks) instead.
error.parsing.hint.js_style_const=Hint: Onion has no `const` keyword — declare a variable with `val` (immutable) or `var` (mutable) instead — write `val name: Type = value`, not `const name = value`.
error.parsing.hint.nullable_union_type=Hint: a nullable type is written with a trailing `?`, not a TypeScript-style union with `null` — write `{0}?`, not `{0} | null`.
error.parsing.hint.js_style_let=Hint: Onion has no `let` keyword — declare a variable with `val` (immutable) or `var` (mutable) instead — write `val name: Type = value`, not `let name = value`.
error.parsing.hint.rust_style_mut=Hint: Onion has no `mut` keyword — mutability is chosen by `val` (immutable) or `var` (mutable) directly, so drop `mut` — write `var {1} = ...`, not `{0} mut {1} = ...`.
error.parsing.hint.if_let_binding=Hint: Onion has no Swift/Rust-style `{0} let` optional binding — bind the variable first, then null-check it: `var {1} = {2}; {0} {1} != null '{' ... '}'`, not `{0} let {1} = {2} '{' ... '}'`.
error.parsing.hint.guard_let_else=Hint: Onion has no Swift-style `guard let ... else` early exit — bind the value, then invert the check for the exit: `val {0} = {1}; if {0} == null '{' ... '}'`, not `guard let {0} = {1} else '{' ... '}'`.
error.parsing.hint.guard_else=Hint: Onion has no Swift-style `guard <condition> else` early exit — invert the condition into a plain `if`: `if !({0}) '{' ... '}'`, not `guard {0} else '{' ... '}'`.
error.parsing.hint.data_class_declaration=Hint: Onion has no `data class` — a data-carrying type is a `record`, whose component list has no `val`/`var` prefix. Write `record {0}({1})`, not `data class {0}(...)`.
error.parsing.hint.struct_declaration=Hint: Onion has no `struct` — a data-carrying type is a `record`, whose components are declared in parentheses after its name, not in a brace body — write `record {0}(x: Int, y: Int)`, not `struct {0} '{' x: Int, y: Int '}'`.
error.parsing.hint.object_declaration=Hint: Onion has no Kotlin/Scala-style singleton `object` declaration — group shared functionality in a class with only static members instead — write `class {0} '{'public: static def member(): T = ...'}'`, not `object {0} '{' ... '}'`.
error.parsing.hint.go_style_short_var_decl=Hint: Onion has no Go-style `:=` short variable declaration — declare it with `val` (immutable) or `var` (mutable) instead — write `val {0} = {1}`, not `{0} := {1}`.
error.parsing.hint.using_resource_statement=Hint: Onion has no C#/Python-style `using` resource statement — write a try-with-resources block instead: `try (val {0} = {1}) '{' ... '}'`, not `using {0} = {1} '{' ... '}'`.
error.parsing.hint.csharp_style_using_import=Hint: Onion has no C#-style `using` import directive — imports are wrapped in braces — write `import '{' {0} '}'`, not `using {0};`.
error.parsing.hint.python_style_from_import=Hint: Onion has no Python-style `from ... import ...` statement — imports are wrapped in braces — write `import '{' {0} '}'`, not `from {1} import {2}`.
error.parsing.hint.c_style_cast=Hint: a type cast uses postfix `as`, not a C-style prefix — write `(expr as {0})`, not `({0}) expr`.
error.parsing.hint.dollar_sigil=Hint: Onion has no `$` sigil for variables or string interpolation — interpolate inside a string with `#{expr}` instead — write `"Hello, #{name}!"`, not `$"Hello, {name}!"` or `$name`.
error.parsing.hint.missing_call_parens=Hint: a call''s arguments need parentheses — write `{0}(...)` instead of `{0} ...`. (Two separate statements go on separate lines, or joined with `;`.)
error.parsing.hint.java_style_final_local=Hint: Onion has no Java-style `final` local variable — every `val` is already immutable, so declare it with `val` instead — write `val {1}: {0} = ...`, not `final {0} {1} = ...`.
error.parsing.hint.instanceof_not_supported=Hint: Onion has no Java-style `instanceof` operator — use the `is` type-check operator instead (also usable as `case x is Type:` in `select`) — write `{0} is {1}`, not `{0} instanceof {1}`.
error.semantic.toolUndeclaredEffect=tool `{0}` performs `{1}` here (calling {2}) but does not declare it. Add `{1}` to its `requires '{' ... '}'` clause.
error.semantic.toolUnusedCapability=tool `{0}` declares capability `{1}` but nothing in its body can perform it. Remove `{1}` from the requires clause.
error.semantic.toolBadCapability=tool `{0}` has an invalid capability `{1}`: {2}
error.semantic.toolCapability.notAnEffect=`{0}` is not an effect. The vocabulary is: {1}
error.semantic.toolCapability.takesNoArgument=`{0}` does not take a parameter argument
error.semantic.toolCapability.badParameter=`{0}` does not name a parameter of the tool
error.semantic.shapeInstanceWithoutLaw=class `{0}` implements onion.Shape but nothing in its file asserts a law. Add a `law` or an `example` — the round-trip `s.parse(s.print(v)).get() == v` is the canonical one — so the claim is machine-checked.
error.semantic.toolParameterNotCliConvertible=tool `{0}` cannot derive a command line: parameter `{1}` has type {2}, which cannot be read from an argument. Supported parameter types: {3}.
error.semantic.duplicateToolName=duplicate tool name `{0}`. A tool is selected on the command line by name alone, so a second tool with the same name can never be invoked and the contract cannot address either one. Rename one of them.
error.semantic.unreachableCatchClause=this catch clause for {0} can never be reached: an earlier catch clause for {1} already handles it. Move it before the {1} clause, or remove it.
error.semantic.duplicateExtensionMethod=duplicated extension method {1}({2}) on {0}.
