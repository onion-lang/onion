error.semantic.duplicateRecordComponent=duplicated record component {1} in {0}. Each component name generates an accessor method and a field, so a repeated name collides with itself.
error.semantic.secondaryConstructorMustDelegate=class {0} has a primary constructor, so every `def this` must delegate to it: write `def this(...) : this({1}) '{' ... '}'`. The primary constructor owns the superclass call and initializes the `val`/`var` parameter fields; a constructor that goes around it leaves those fields at their defaults.
error.semantic.constructorDelegationCycle=constructor delegation in {0} never reaches a constructor that calls the superclass: `def this({1})` delegates in a cycle back to itself. Constructing the object would overflow the stack.
error.semantic.constructorInRecordOrEnum=a {0} cannot declare `def this`: {1} already has its canonical constructor, and there is nothing a second one could mean. Use a static factory method instead.
error.semantic.thisBeforeConstructorDelegation=`this` is used in a constructor''s delegation arguments before the object of {0} exists. Neither `this` nor a field can be read in the arguments of `: this(...)` or `extends B(...)`; pass a parameter or a constant instead.
